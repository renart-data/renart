name: live e2e

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.8.22

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install web dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Build web assets
        working-directory: web
        run: corepack pnpm build

      - name: Build Bruin SQL parser link shim
        run: |
          libdir="$(./scripts/build_bruin_sqlparser_stub.sh linux-amd64)"
          echo "CGO_LDFLAGS=-L${libdir}" >> "$GITHUB_ENV"

      - name: Verify Go module cache integrity
        run: go mod verify

      - name: Build Renart binary
        run: go build -o renart .

      - name: Run live e2e tests
        working-directory: web
        env:
          BRUIN_E2E_BINARY: ${{ github.workspace }}/renart
          PWTEST_CACHE_DIR: /dev/shm/bruin-playwright/cache
          RENART_E2E_LIVE_WORKERS: 1
        run: corepack pnpm exec playwright test --config=playwright.live.config.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-e2e-artifacts
          path: /dev/shm/bruin-playwright/test-results
          if-no-files-found: ignore

      - name: Upload live timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-e2e-timings
          path: |
            /dev/shm/bruin-playwright/test-results/live-timings.json
            /dev/shm/bruin-playwright/test-results/live-timings.md
          if-no-files-found: ignore

      - name: Clean up live e2e containers
        if: always()
        run: |
          for prefix in renart-e2e-pg renart-e2e-ch renart-e2e-trino; do
            docker ps -aq --filter "name=$prefix" | xargs -r docker rm -f
          done
          docker network ls -q --filter "name=renart-e2e-warehouse" | xargs -r docker network rm
