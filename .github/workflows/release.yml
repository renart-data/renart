name: release

on:
  pull_request:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GORELEASER_CROSS_IMAGE: goreleaser/goreleaser-cross@sha256:bd51e63c1432305eb0309cdf3bff11e5ae6419cefb10839fea3e705f3e5d57da

jobs:
  standalone-helpers:
    name: standalone helper (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            macos_deployment_target: ""
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            macos_deployment_target: ""
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            macos_deployment_target: "10.15"
          - runner: macos-15
            goos: darwin
            goarch: arm64
            macos_deployment_target: "11.0"
          - runner: windows-2025
            goos: windows
            goarch: amd64
            macos_deployment_target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build and verify standalone helper
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: ./scripts/build_standalone_helper.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" dist/standalone

      - name: Upload standalone helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renart-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/standalone/*
          if-no-files-found: error
          retention-days: 1

  release-snapshot:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: standalone-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache pinned Zig release toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/renart/zig
          key: ${{ runner.os }}-zig-0.15.2-${{ hashFiles('scripts/install_release_zig.sh') }}

      - name: Install pinned Zig release toolchain
        run: ./scripts/install_release_zig.sh

      - name: Cache pinned Syft release tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/renart/syft
          key: ${{ runner.os }}-syft-1.44.0-${{ hashFiles('scripts/install_release_syft.sh') }}

      - name: Install pinned Syft release tool
        run: ./scripts/install_release_syft.sh

      - name: Build web assets
        working-directory: web
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build

      - name: Restore generated icon assets
        run: git restore web/public/icons

      - name: Verify third-party licenses and notices
        run: ./scripts/check-third-party-licenses.sh

      - name: Download standalone helpers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: renart-gui-*
          path: .release/standalone

      - name: Prepare cross-build cache mounts
        run: |
          mkdir -p "$HOME/go/pkg/mod" "$HOME/.cache/go-build"

      - name: Verify release configuration and artifacts
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/go/pkg/mod":/root/go/pkg/mod \
            -v "$HOME/.cache/go-build":/root/.cache/go-build \
            -v "$HOME/.cache/renart/zig":/root/.cache/renart/zig:ro \
            -v "$HOME/.cache/renart/syft/1.44.0/syft":/usr/local/bin/syft:ro \
            -e GOTOOLCHAIN=go1.26.5 \
            -v "$PWD":/src \
            -w /src \
            "$GORELEASER_CROSS_IMAGE" \
            release --snapshot --skip=publish --clean --verbose --parallelism=1
          ./scripts/smoke-release-artifacts.sh dist
          go mod verify

  python-sdk-wheel:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build and validate release SDK wheel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Python SDK publication requires a stable vMAJOR.MINOR.PATCH tag; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          go test ./internal/pysdk/...
          go run \
            -ldflags "-X renart/internal/pysdk.Version=$version" \
            ./internal/pysdk/cmd/buildwheel \
            -output dist/python-sdk
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check dist/python-sdk/*.whl
          python -m pip install --disable-pip-version-check --no-deps --target /tmp/renart-sdk dist/python-sdk/*.whl
          PYTHONPATH=/tmp/renart-sdk python -c "import renart; assert callable(renart.query)"

      - name: Upload SDK wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renart-python-wheel
          path: dist/python-sdk/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - python-sdk-wheel
      - standalone-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache pinned Zig release toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/renart/zig
          key: ${{ runner.os }}-zig-0.15.2-${{ hashFiles('scripts/install_release_zig.sh') }}

      - name: Install pinned Zig release toolchain
        run: ./scripts/install_release_zig.sh

      - name: Cache pinned Syft release tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/renart/syft
          key: ${{ runner.os }}-syft-1.44.0-${{ hashFiles('scripts/install_release_syft.sh') }}

      - name: Install pinned Syft release tool
        run: ./scripts/install_release_syft.sh

      - name: Build web assets
        working-directory: web
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build

      - name: Restore generated icon assets
        run: git restore web/public/icons

      - name: Verify third-party licenses and notices
        run: ./scripts/check-third-party-licenses.sh

      - name: Download standalone helpers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: renart-gui-*
          path: .release/standalone

      - name: Prepare cross-build cache mounts
        run: |
          mkdir -p "$HOME/go/pkg/mod" "$HOME/.cache/go-build"

      - name: Build draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/go/pkg/mod":/root/go/pkg/mod \
            -v "$HOME/.cache/go-build":/root/.cache/go-build \
            -v "$HOME/.cache/renart/zig":/root/.cache/renart/zig:ro \
            -v "$HOME/.cache/renart/syft/1.44.0/syft":/usr/local/bin/syft:ro \
            -e GITHUB_TOKEN \
            -e GOTOOLCHAIN=go1.26.5 \
            -v "$PWD":/src \
            -w /src \
            "$GORELEASER_CROSS_IMAGE" \
            release --clean --verbose --parallelism=1
          ./scripts/smoke-release-artifacts.sh dist
          go mod verify

      - name: Attest release archives and checksums
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish-python-sdk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
      - python-sdk-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/renart
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download SDK wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: renart-python-wheel
          path: dist/python-sdk

      - name: Publish SDK wheel to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/python-sdk/

  finalize-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-python-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the validated GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
