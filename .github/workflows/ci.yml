name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: go.sum

      - name: Build Bruin SQL parser link shim
        run: |
          libdir="$(./scripts/build_bruin_sqlparser_stub.sh linux-amd64)"
          echo "CGO_LDFLAGS=-L${libdir}" >> "$GITHUB_ENV"

      - name: Verify module integrity
        run: go mod verify

      - name: Test backend
        run: go test -tags=webdev -p=1 ./...

      - name: Vet backend
        run: go vet -tags=webdev -p=1 ./...

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -tags=webdev ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Install web dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile

      - name: Check and build web application
        working-directory: web
        run: corepack pnpm check

      - name: Audit production web dependencies
        working-directory: web
        run: corepack pnpm audit

  docs-and-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Install and build docs
        working-directory: docs
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
          corepack pnpm audit

      - name: Install and type-check VS Code extension
        working-directory: extensions/vscode
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm audit

  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install web dependencies for license inventory
        working-directory: web
        run: corepack pnpm install --frozen-lockfile

      - name: Verify third-party licenses and notices
        run: ./scripts/check-third-party-licenses.sh

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Test and build Python SDK wheel
        run: |
          go test ./internal/pysdk/...
          go run ./internal/pysdk/cmd/buildwheel -output dist/python-sdk
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check dist/python-sdk/*.whl
          python -m pip install --disable-pip-version-check --no-deps --target /tmp/renart-sdk dist/python-sdk/*.whl
          PYTHONPATH=/tmp/renart-sdk python -c "import renart; assert callable(renart.query)"
