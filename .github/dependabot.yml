version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # River's separately versioned drivers must match the core interfaces.
      river:
        patterns:
          - "github.com/riverqueue/river"
          - "github.com/riverqueue/river/*"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/extensions/vscode"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
