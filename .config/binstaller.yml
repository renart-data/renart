# yaml-language-server: $schema=https://raw.githubusercontent.com/binary-install/binstaller/main/schema/InstallSpec.json
schema: v1
name: renart
repo: renart-data/renart
asset:
  template: ${NAME}_${OS}_${ARCH}_duckdb${EXT}
  default_extension: .tar.gz
  rules:
  - when:
      arch: amd64
    arch: x86_64
  - when:
      env:
        RENART_INSTALL_DUCKDB: "0"
    template: ${NAME}_${OS}_${ARCH}${EXT}
  - when:
      os: windows
    ext: .zip
  naming_convention:
    os: titlecase
    arch: lowercase
checksums:
  algorithm: sha256
  template: checksums.txt
supported_platforms:
- os: darwin
  arch: amd64
- os: darwin
  arch: arm64
- os: linux
  arch: amd64
- os: linux
  arch: arm64
- os: windows
  arch: amd64
